name: Deploy Next.js site to Pages

on:
  # Automatisch deployen bij push naar main
  push:
    branches: [main]

  # Handmatig te starten vanuit het Actions-tabblad
  workflow_dispatch:

# Rechten van GITHUB_TOKEN voor deployment naar GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Slechts één gelijktijdige deployment toestaan; in-progress runs niet annuleren
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./devstash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./devstash/package-lock.json
      - name: Verify lockfile
        run: npm ci --dry-run --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Next binary
        run: npx --no-install next --version
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./devstash/out

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
